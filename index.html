<section class="pgcal" lang="de" aria-label="Veranstaltungskalender Pinzgau">
<header><p>PINZGAU · VERANSTALTUNGEN</p><h2>Was ist los in der Region?</h2><p>Zell am See–Kaprun und Umgebung</p></header>
<div class="pgbar">
<label>Suche<input type="search" data-search placeholder="Titel, Ort oder Stichwort"></label>
<label>Gemeinde<select data-place><option value="">Alle Gemeinden</option></select></label>
<label>Kategorie<select data-category><option value="">Alle Kategorien</option></select></label>
<label>Datum<input type="date" data-date></label>
<button type="button" data-highlights aria-pressed="false">Nur Highlights</button>
<button type="button" data-reset>Filter zurücksetzen</button>
</div>
<div class="pgbar" role="group" aria-label="Kalenderansicht">
<button type="button" data-layout="cards" aria-pressed="true">Liste</button>
<button type="button" data-layout="week" aria-pressed="false">Woche</button>
</div>
<div class="pgbar" data-period role="group" aria-label="Zeitraum">
<button type="button" data-view="month" aria-pressed="true">Ganzer Monat</button>
<button type="button" data-view="upcoming" aria-pressed="false">Demnächst</button>
<button type="button" data-view="today" aria-pressed="false">Heute</button>
<button type="button" data-view="tomorrow" aria-pressed="false">Morgen</button>
<button type="button" data-view="weekend" aria-pressed="false">Dieses Wochenende</button>
</div>
<div class="pgbar" data-navigation>
<button type="button" data-prev aria-label="Vorheriger Monat">‹</button>
<h3 data-month></h3>
<button type="button" data-next aria-label="Nächster Monat">›</button>
</div>
<div class="pggrid" data-grid></div>
<p data-status role="status">Der interaktive Kalender benötigt JavaScript.</p>
<button type="button" data-retry hidden>Erneut laden</button>
<div class="pgbar" data-week-navigation hidden>
<button type="button" data-week-prev aria-label="Vorherige Woche">‹</button>
<h3 data-week-label></h3>
<button type="button" data-week-next aria-label="Nächste Woche">›</button>
<button type="button" data-week-today>Heute</button>
</div>
<div data-week-scroll role="region" aria-label="Wochenübersicht, horizontal scrollbar" tabindex="0" hidden><div data-week></div></div>
<div data-events></div>
<p class="pg-import"><small data-export></small></p>
<script>
(() => {
  const root = document.currentScript.closest('.pgcal');
  const get = selector => root.querySelector(selector);

  if (window.parent !== window && new URLSearchParams(location.search).get('embed') === '1') {
    document.documentElement.classList.add('pgcal-embedded');
    const publishHeight = () => {
      window.parent.postMessage({
        type: 'pinzgau-calendar-height',
        height: Math.ceil(root.getBoundingClientRect().height)
      }, '*');
    };
    const observer = new ResizeObserver(publishHeight);
    observer.observe(root);
    window.addEventListener('load', publishHeight);
    publishHeight();
  }
  const status = get('[data-status]');
  const retry = get('[data-retry]');

  async function loadCalendar() {
    retry.hidden = true;
    status.textContent = 'Veranstaltungen werden geladen …';
    try {
      const response = await fetch(new URL('./Veranstaltungen.json', location.href), {
        cache: 'no-store',
        signal: AbortSignal.timeout(15000)
      });
      if (!response.ok) throw new Error('HTTP ' + response.status);
      const feed = await response.json();
      if (!Array.isArray(feed.veranstaltungen)) throw new Error('Ungültige Veranstaltungsdaten');
      initializeCalendar(feed);
    } catch (error) {
      console.error('Kalenderdaten konnten nicht geladen werden.', error);
      status.textContent = 'Veranstaltungen konnten nicht geladen werden.';
      retry.hidden = false;
    }
  }

  function initializeCalendar(feed) {
    const date = get('[data-date]');
    const search = get('[data-search]');
    const place = get('[data-place]');
    const grid = get('[data-grid]');
    const options = {timeZone: feed.zeitzone};
    const dayKey = new Intl.DateTimeFormat('sv-SE', {...options, dateStyle:'short'});
    const dayLabel = new Intl.DateTimeFormat('de-AT', {...options, dateStyle:'full'});
    const timeLabel = new Intl.DateTimeFormat('de-AT', {...options, timeStyle:'short'});
    const category = get('[data-category]');
    const highlights = get('[data-highlights]');
    let highlightsOnly = false;
    const aliases = {Bruck:'Bruck an der Großglocknerstraße', Hütten:'Leogang',
      'Königsleiten/Wald':'Wald im Pinzgau', 'Saalfelden am Steinernen Meer':'Saalfelden'};
    const rules = [
      ['Familie', /kasperl|märchen|kinder|eltern|geschichtenzeit|familie/i],
      ['Märkte & Brauchtum', /markt|advent|kirtag|basar|krampus|kramperl|gottesdienst|rit[t]?\b|brauch|vogelbörse|kleintierschau/i],
      ['Musik & Kultur', /konzert|musik|lesung|kino|ausstellung|chor|trio|cäcilia|kabarett|markus linder|theater|benefizabend/i],
      ['Sport & Berg', /snowboard|awakening|ski|wald Baden|waldbaden|wandern|sport/i],
      ['Kurse & Führungen', /kurs|workshop|schau(tag)?führung|führung|seminar|ausbildung|vortrag|schreiben|italienisch|sommelier/i],
      ['Kulinarik', /brunch|menü|törggelen|kulinarik/i]
    ];
    const shift = (day, amount) => new Date(Date.parse(day+'T12:00:00Z') + amount*86400000).toISOString().slice(0,10);
    const hash = text => {
      let value = 2166136261;
      for (const char of text) value = Math.imul(value ^ char.codePointAt(0),16777619);
      return (value >>> 0).toString(36);
    };
    const pinzgaBraeu = /\bpinzga[\s-]+br(?:äu|aeu|au)\b/i;
    const atPinzgaBraeu = /\b(?:beim|im|in der|bei)\s+pinzga[\s-]+br(?:äu|aeu|au)\b/i;
    const isHighlight = event => pinzgaBraeu.test(event.ort) || atPinzgaBraeu.test(event.titel);
    const events = feed.veranstaltungen.map(event => ({
      ...event,
      day: event.datum || dayKey.format(new Date(event.beginn)),
      town: event.ort.split(',').at(-1).trim().replace(/^\d{4}\s+/, ''),
      category: event.kategorie || rules.find(([,pattern]) => pattern.test(event.titel))?.[0] || 'Sonstiges',
      id: 'pinzgau-termin-' + hash([event.titel,event.datum,event.beginn,event.ort].join('|'))
    })).sort((a,b) => a.day.localeCompare(b.day) || (a.beginn || 'z').localeCompare(b.beginn || 'z'));

    for (const event of events) event.town = aliases[event.town] || event.town;
    for (const name of [...new Set(events.map(event => event.category))].sort((a,b)=>a.localeCompare(b,'de'))) {
      category.add(new Option(name,name));
    }
    const today = dayKey.format(new Date());
    const tomorrow = shift(today,1);
    const weekday = new Date(today+'T12:00:00Z').getUTCDay();
    const saturday = shift(today,weekday === 0 ? -1 : 6-weekday);
    const sunday = shift(saturday,1);
    let view = 'upcoming';
    let layout = 'cards';
    const monday = day => shift(day, -((new Date(day+'T12:00:00Z').getUTCDay()+6)%7));
    let weekStart = monday(today);
    const weekScroll = get('[data-week-scroll]');
    const weekGrid = get('[data-week]');
    const weekRange = new Intl.DateTimeFormat('de-AT', {...options, dateStyle:'medium'});
    const weekDay = new Intl.DateTimeFormat('de-AT', {...options, weekday:'short', day:'2-digit', month:'2-digit'});
    let month = (events[0]?.day || feed.datum || today).slice(0,7);
    if (today >= (feed.zeitraum?.von || events[0]?.day) && today <= (feed.zeitraum?.bis || events.at(-1)?.day)) month = today.slice(0,7);
    const initialMonth = month;
    const linked = events.find(event => '#'+event.id === location.hash);
    if (linked) {
      view = 'month';
      month = linked.day.slice(0,7);
      date.value = linked.day;
    }

    for (const town of [...new Set(events.map(event => event.town))].sort((a,b) => a.localeCompare(b,'de'))) {
      place.add(new Option(town,town));
    }

    function make(tag, text) {
      const element = document.createElement(tag);
      element.textContent = text;
      return element;
    }
    function setLink(anchor, url) {
      if (/^https?:\/\//i.test(url || '')) anchor.href = url;
    }
    const imported = feed.importiert_am || feed.letzter_erfolgreicher_import;
    const validImport = imported && Number.isFinite(Date.parse(imported));
    get('[data-export]').textContent =
      (validImport ? 'Letzter erfolgreicher Import: ' + dayLabel.format(new Date(imported)) + (/T/.test(imported) ? ', ' + timeLabel.format(new Date(imported)) : '') :
        'Importzeitpunkt nicht im Datensatz enthalten');

    function render() {
      const weekly = layout === 'week';
      for (const button of root.querySelectorAll('[data-layout]')) {
        button.setAttribute('aria-pressed',String(button.dataset.layout === layout));
      }
      get('[data-period]').hidden = weekly;
      get('[data-week-navigation]').hidden = !weekly;
      weekScroll.hidden = !weekly;
      for (const button of root.querySelectorAll('[data-view]')) {
        button.setAttribute('aria-pressed',String(button.dataset.view === view));
      }
      const term = search.value.trim().toLocaleLowerCase('de');
      highlights.setAttribute('aria-pressed', String(highlightsOnly));
      const matching = events.filter(event =>
        (!highlightsOnly || isHighlight(event)) &&
        (!place.value || event.town === place.value) &&
        (!category.value || event.category === category.value) &&
        [event.titel,event.ort,event.beschreibung].join(' ').toLocaleLowerCase('de').includes(term)
      );
      const weekEnd = shift(weekStart,6);
      const visible = weekly ? matching.filter(event => event.day >= weekStart && event.day <= weekEnd) : matching.filter(event =>
        (!date.value || event.day === date.value) &&
        (date.value || ({
          month: event.day.startsWith(month), upcoming: event.day >= today,
          today: event.day === today, tomorrow: event.day === tomorrow,
          weekend: event.day >= saturday && event.day <= sunday
        })[view])
      );
      get('[data-navigation]').hidden = weekly || view !== 'month';
      grid.hidden = weekly || view !== 'month';
      grid.replaceChildren();

      if (!weekly && view === 'month') {
        const [year,number] = month.split('-').map(Number);
        const first = new Date(Date.UTC(year,number-1,1,12));
        get('[data-month]').textContent = new Intl.DateTimeFormat('de-AT',{
          ...options, month:'long',year:'numeric'
        }).format(first);
        for (let i = 1; i <= new Date(Date.UTC(year,number,0)).getUTCDate(); i++) {
          const key = month + '-' + String(i).padStart(2,'0');
          const count = matching.filter(event => event.day === key).length;
          const button = make('button','');
          const weekday = new Intl.DateTimeFormat('de-AT',{...options,weekday:'short'}).format(new Date(key+'T12:00:00Z'));
          button.append(make('span',weekday),make('strong',String(i)));
          button.type = 'button';
          button.className = 'pgday' + (count ? ' has-events' : '');
          button.disabled = !count;
          button.setAttribute('aria-pressed',String(date.value === key));
          button.setAttribute('aria-label',dayLabel.format(new Date(key+'T12:00:00Z')) + ', ' + count + ' Termine');
          
          button.onclick = () => {
            date.value = date.value === key ? '' : key;
            render();
            grid.querySelectorAll('button')[i-1].focus();
          };
          grid.append(button);
        }
      }
      get('[data-status]').textContent = visible.length
        ? visible.length + (visible.length === 1 ? ' Termin' : ' Termine')
        : 'Keine Termine in den geladenen Daten für diese Auswahl.';
      const cards = get('[data-events]');
      cards.hidden = weekly;
      cards.replaceChildren();
      weekGrid.replaceChildren();
      const columns = new Map();
      if (weekly) {
        get('[data-week-label]').textContent = weekRange.formatRange(
          new Date(weekStart+'T12:00:00Z'), new Date(weekEnd+'T12:00:00Z'));
        for (let i = 0; i < 7; i++) {
          const day = shift(weekStart,i);
          const column = make('section','');
          column.className = 'pgweek-day';
          const heading = make('h3',weekDay.format(new Date(day+'T12:00:00Z')));
          if (day === today) heading.setAttribute('aria-current','date');
          column.append(heading);
          columns.set(day,column);
          weekGrid.append(column);
        }
      }
      for (const event of visible) {
        const start = new Date(event.beginn || event.day + 'T12:00:00Z');
        const time = !event.beginn ? 'Uhrzeit nicht erfasst' : event.ende
          ? timeLabel.format(start) + '–' + timeLabel.format(new Date(event.ende))
          : 'ab ' + timeLabel.format(start);
        const card = make('article','');
        card.id = event.id;
        card.classList.toggle('pg-highlight',isHighlight(event));
        const badge = make('time','');
        badge.className = 'pgbadge';
        badge.dateTime = event.day;
        badge.setAttribute('aria-label',dayLabel.format(start));
        const short = field => new Intl.DateTimeFormat('de-AT',{...options,[field]:'short'}).format(start);
        badge.append(make('span',short('weekday')),make('strong',event.day.slice(-2)),make('span',short('month')));
        const meta = make('div','');
        meta.className = 'pgmeta';
        const title = Array.from(event.titel);
        const heading = make(weekly ? 'h4' : 'h3',
          title.length > 75 ? title.slice(0,75).join('').trimEnd() + '...' : event.titel);
        if (title.length > 75) {
          heading.title = event.titel;
          heading.setAttribute('aria-label',event.titel);
        }
        const info = make('div','');
        info.className = 'pgevent-info';
        const timeLabel = make('span',time + (!weekly && event.beginn ? ' Uhr' : ''));
        timeLabel.className = 'pgevent-time';
        const placeLabel = make('span',weekly ? event.town : event.ort);
        placeLabel.className = 'pgevent-place';
        if (weekly) placeLabel.title = event.ort;
        info.append(timeLabel,placeLabel);
        meta.append(heading,info);
        const state = String(event.status || '').toLowerCase();
        const cancelled = ['abgesagt','cancelled','canceled'].includes(state);
        const postponed = ['verschoben','postponed'].includes(state);
        if (cancelled || postponed) {
          const flag = make('strong',cancelled ? 'Abgesagt' : 'Verschoben');
          flag.className = 'pgflag';
          meta.append(flag);
        }
        if (!weekly) card.append(badge);
        card.append(meta);
        const link = make('a','Quelle ↗');
        link.className = 'pgsource';
        link.setAttribute('aria-label','Quelle zu ' + event.titel);
        setLink(link,event.quelle);
        const links = make('div','');
        links.className = 'pgcard-links';
        const categoryLabel = make('span',event.category);
        categoryLabel.className = 'pgcategory';
        if (!weekly) links.append(categoryLabel);
        if (link.hasAttribute('href')) links.append(link);
        if (links.children.length) meta.append(links);
        (weekly ? columns.get(event.day) : cards).append(card);
      }
      for (const column of columns.values()) {
        if (column.children.length === 1) {
          const empty = make('p','Keine Termine');
          empty.className = 'pgweek-empty';
          column.append(empty);
        }
      }
    }

    function moveMonth(delta) {
      const [year,number] = month.split('-').map(Number);
      month = new Date(Date.UTC(year,number-1+delta,1)).toISOString().slice(0,7);
      date.value = '';
      render();
    }
    get('[data-prev]').onclick = () => moveMonth(-1);
    get('[data-next]').onclick = () => moveMonth(1);
    function moveWeek(amount) {
      weekStart = amount === 0 ? monday(today) : shift(weekStart,amount*7);
      date.value = '';
      weekScroll.scrollLeft = 0;
      render();
    }
    get('[data-week-prev]').onclick = () => moveWeek(-1);
    get('[data-week-next]').onclick = () => moveWeek(1);
    get('[data-week-today]').onclick = () => moveWeek(0);
    for (const button of root.querySelectorAll('[data-layout]')) {
      button.onclick = () => {
        if (layout === button.dataset.layout) return;
        layout = button.dataset.layout;
        if (layout === 'week' && date.value) weekStart = monday(date.value);
        render();
      };
    }
    search.oninput = render;
    place.onchange = category.onchange = render;
    highlights.onclick = () => {
      highlightsOnly = !highlightsOnly;
      render();
    };
    date.onchange = () => {
      if (date.value) {
        month = date.value.slice(0,7);
        weekStart = monday(date.value);
        view = 'month';
      }
      render();
    };
    get('[data-reset]').onclick = () => {
      highlightsOnly = false;
      search.value = place.value = date.value = category.value = '';
      view = 'upcoming';
      month = initialMonth;
      weekStart = monday(today);
      render();
    };
    for (const button of root.querySelectorAll('[data-view]')) {
      button.onclick = () => {
        view = button.dataset.view;
        date.value = '';
        for (const item of root.querySelectorAll('[data-view]')) {
          item.setAttribute('aria-pressed',String(item === button));
        }
        render();
      };
    }
    render();
    function showLinkedEvent() {
      const event = events.find(item => '#'+item.id === location.hash);
      if (!event) return;
      view = 'month';
      month = event.day.slice(0,7);
      date.value = event.day;
      weekStart = monday(event.day);
      highlightsOnly = false;
      search.value = place.value = category.value = '';
      render();
      const card = document.getElementById(event.id);
      card?.scrollIntoView({block:'center'});
    }
    window.addEventListener('hashchange',showLinkedEvent);
    if (linked) requestAnimationFrame(showLinkedEvent);
  }

  retry.onclick = loadCalendar;
  loadCalendar();
})();
</script>
</section>
